<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NOVAprotect</title>
  <meta name="theme-color" content="#000000" />

  <link rel="manifest" href="/NovaProtect/manifest.json" />
  <link rel="icon" href="/NovaProtect/icon-192.png" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 20px;
    }

    .title {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .status {
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.7;
      text-align: center;
    }

    button {
      margin-top: 20px;
      padding: 10px 15px;
      border: none;
      background: white;
      color: black;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <img src="/NovaProtect/icon-512.png" class="logo" alt="NOVAprotect" />

  <div class="title">NOVAprotect</div>
  <div class="status" id="status">Initialisation...</div>

  <button onclick="clearCache()">Reset cache</button>

  <script>
    const status = document.getElementById("status");

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/NovaProtect/sw.js")
          .then(() => {
            status.innerText = "Service Worker actif ✔";
          })
          .catch(err => {
            status.innerText = "Erreur SW: " + err;
          });
      });
    }

    function clearCache() {
      caches.keys().then(keys => {
        keys.forEach(key => caches.delete(key));
      });

      localStorage.clear();

      status.innerText = "Cache supprimé ✔ Recharge la page";
    }
  </script>

</body>
</html>
